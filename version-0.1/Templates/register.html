{% extends "base.html" %}
{% block page_title %}Task Journey | Home Page{% endblock %}
{% block content %}

<div class="w3-section w3-content" style="max-width: 500px; height: 96.75vh; padding-top: 10.5vh; padding-bottom: 11vh; ">
    <div id="centerBackground" class="color-transparentWhite w3-card-4 w3-container w3-round-xlarge" style="padding: 25px;">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required><br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br><br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required><br><br>
        <button type="submit" id="register-button" class="task-button">Register</button>
    </div>
</div>

{% endblock %}
