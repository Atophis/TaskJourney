
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Task Manager</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #a2c9b2;
    color: #82c7b8d5;
}

header {
    background: #317955;
    color: rgb(153, 241, 207);
    padding: 25px;
    text-align: center;
}

.container {
    max-width: 900px;
    margin: 30px auto;
    padding: 20px;
}

.form-box, .task-box {
    background: white;
    padding: 22px;
    border-radius: 12px;
    margin-bottom: 22px;
    box-shadow: 0 3px 12px #004d0f10;
}

h2 {
    margin-top: 0;
}

input, textarea {
    width: 100%;
    padding: 12px;
    margin: 8px 0 15px;
    border: 1px solid #ccd3df;
    border-radius: 7px;
    font-size: 15px;
}

textarea {
    resize: vertical;
    min-height: 75px;
}

button {
    padding: 10px 16px;
    border: none;
    border-radius: 7px;
    cursor: pointer;
    font-weight: bold;
    margin: 3px;
}

.add-btn {
    background: #315fc4;
    color: white;
    width: 100%;
}

.edit-btn {
    background: #e5a52c;
    color: white;
}

.delete-btn {
    background: #dc4545;
    color: white;
}

.complete-btn {
    background: #269b69;
    color: white;
}

.filter-btn {
    background: #e0e6f0;
    color: #263247;
}

.filter-btn.active {
    background: #263b63;
    color: white;
}

.task {
    border-left: 5px solid #315fc4;
    padding: 15px;
    margin: 15px 0;
    background: #f8faff;
    border-radius: 7px;
}

.task.completed {
    border-left-color: #269b69;
    opacity: 0.7;
}

.task.completed h3 {
    text-decoration: line-through;
}

.task.overdue {
    border-left-color: #dc4545;
}

.task h3 {
    margin: 0 0 8px;
}

.task p {
    margin: 7px 0;
}

.task-date {
    font-size: 13px;
    color: #68758a;
}

.filters {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-bottom: 15px;
}

#taskCount {
    color: #68758a;
    font-size: 14px;
}

</style>
</head>

<body>

<header>
    <h1>My Task Manager</h1>
    <p>Organize your tasks and stay on schedule</p>
</header>

<div class="container">

    <div class="form-box">
        <h2 id="formTitle">Add a New Task</h2>

        <form id="taskForm">
            <label>Task Name</label>
            <input type="text" id="taskName"
                   placeholder="Enter task name" required>

            <label>Description</label>
            <textarea id="taskDescription"
                      placeholder="Enter task details"></textarea>

            <label>Due Date</label>
            <input type="date" id="taskDate">

            <button type="submit" class="add-btn" id="submitBtn">
                Save Task
            </button>
        </form>
    </div>

    <div class="task-box">
        <h2>My Tasks</h2>

        <div class="filters">
            <button class="filter-btn active"
                    onclick="filterTasks('all', this)">All</button>

            <button class="filter-btn"
                    onclick="filterTasks('active', this)">Active</button>

            <button class="filter-btn"
                    onclick="filterTasks('completed', this)">Completed</button>

            <button class="filter-btn"
                    onclick="filterTasks('overdue', this)">Overdue</button>
        </div>

        <p id="taskCount"></p>

        <div id="taskList"></div>
    </div>

</div>

<script>

let tasks = JSON.parse(
    localStorage.getItem("myTasks")
) || [];

let editingId = null;
let currentFilter = "all";

const form = document.getElementById("taskForm");

function saveTasks() {
    localStorage.setItem("myTasks", JSON.stringify(tasks));
}

form.addEventListener("submit", function(e) {
    e.preventDefault();

    const name = document.getElementById("taskName").value.trim();
    const description = document.getElementById("taskDescription").value;
    const date = document.getElementById("taskDate").value;

    if (!name) return;

    if (editingId !== null) {
        const task = tasks.find(t => t.id === editingId);

        task.name = name;
        task.description = description;
        task.date = date;

        editingId = null;

        document.getElementById("formTitle").textContent =
            "Add a New Task";

        document.getElementById("submitBtn").textContent =
            "Save Task";

    } else {
        tasks.push({
            id: Date.now(),
            name: name,
            description: description,
            date: date,
            completed: false
        });
    }

    saveTasks();
    form.reset();
    displayTasks();
});

function displayTasks() {
    const list = document.getElementById("taskList");
    list.innerHTML = "";

    let filtered = tasks.filter(task => {
        if (currentFilter === "active")
            return !task.completed;

        if (currentFilter === "completed")
            return task.completed;

        if (currentFilter === "overdue")
            return !task.completed &&
                task.date &&
                task.date < getToday();

        return true;
    });

    document.getElementById("taskCount").textContent =
        filtered.length + " task(s)";

    if (filtered.length === 0) {
        list.innerHTML = "<p>No tasks found.</p>";
        return;
    }

    filtered.sort((a, b) => {
        if (!a.date) return 1;
        if (!b.date) return -1;
        return a.date.localeCompare(b.date);
    });

    filtered.forEach(task => {
        const div = document.createElement("div");

        const overdue = !task.completed && task.date && task.date < getToday();

        div.className = "task" + (task.completed ? " completed" : "") + (overdue ? " overdue" : "");

        const heading = document.createElement("h3");
        heading.textContent = task.name;

        const description = document.createElement("p");
        description.textContent = task.description || "No description";

        const date = document.createElement("p");
        date.className = "task-date";
        date.textContent = task.date ? "Due: " + task.date
                        : "No due date";

        const status = document.createElement("p");
        status.textContent = task.completed ? "Completed"
                            : overdue ? "Overdue" : "In progress";

        const completeBtn = document.createElement("button");
        completeBtn.className = "complete-btn";
        completeBtn.textContent = task.completed
            ? "Undo" : "Complete";
        completeBtn.onclick = () => toggleComplete(task.id);

        const editBtn = document.createElement("button");
        editBtn.className = "edit-btn";
        editBtn.textContent = "Edit";
        editBtn.onclick = () => editTask(task.id);

        const deleteBtn = document.createElement("button");
        deleteBtn.className = "delete-btn";
        deleteBtn.textContent = "Delete";
        deleteBtn.onclick = () => deleteTask(task.id);

        div.append(heading, description, date, status,
                    completeBtn, editBtn, deleteBtn);

        list.appendChild(div);
    });
}

function editTask(id){
    const task = tasks.find(t => t.id === id);

    document.getElementById("taskName").value = task.name;
    document.getElementById("taskDescription").value = task.description;
    document.getElementById("taskDate").value = task.date;

    editingId = id;

    document.getElementById("formTitle").textContent =
        "Edit Task";

    document.getElementById("submitBtn").textContent =
        "Update Task";

    window.scrollTo({ top: 0, behavior: "smooth" });
}

function deleteTask(id) {
    if (!confirm("Are you sure you want to delete this task?"))
        return;

    tasks = tasks.filter(t => t.id !== id);

    if (editingId === id) {
        editingId = null;
        form.reset();
        document.getElementById("formTitle").textContent =
            "Add a New Task";
        document.getElementById("submitBtn").textContent =
            "Save Task";
    }

    saveTasks();
    displayTasks();
}

function toggleComplete(id) {
    const task = tasks.find(t => t.id === id);
    task.completed = !task.completed;

    saveTasks();
    displayTasks();
}

function filterTasks(filter, button) {
    currentFilter = filter;

    document.querySelectorAll(".filter-btn")
        .forEach(btn => btn.classList.remove("active"));

    button.classList.add("active");

    displayTasks();
}

function getToday() {
    const d = new Date();
    const offset = d.getTimezoneOffset();
    return new Date(d.getTime() - offset * 60000)
        .toISOString().split("T")[0];
}

displayTasks();

</script>

</body>
</html>
